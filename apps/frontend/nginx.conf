# Configurazione di Nginx per servire il bundle statico del frontend.
# Le route della Single Page Application ricadono su /index.html, così React
# Router può gestire Dashboard, Cronologia, Profilo e le altre viste.
user nginx;
# Adatta il numero dei processi worker alle CPU disponibili.
worker_processes auto;

pid /tmp/nginx.pid;

events {
    # Limita a 1024 le connessioni gestibili da ciascun worker.
    worker_connections 1024;
}

http {
    # Associa le estensioni degli asset al Content-Type delle risposte HTTP.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Omette la versione di Nginx dagli header e dalle pagine di errore generate dal server.
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Comprime i tipi testuali elencati per ridurre il traffico degli asset serviti.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

    server {
        listen 80;
        server_name _;

        # Cerca i documenti nella directory in cui il Dockerfile copia il bundle Vite.
        root /usr/share/nginx/html;
        index index.html;

        # Richiede al browser di rispettare il tipo dichiarato e limita l'inclusione della pagina in frame.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Disabilita nella pagina l'accesso alle tre funzionalità del browser elencate.
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

        # Gli asset compilati hanno cache lunga; un file assente restituisce 404 senza fallback alla SPA.
        location /assets/ {
            try_files $uri =404;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable" always;
        }

        # Applica una cache di un giorno a immagini e font, con confronto dell'estensione senza distinzione di maiuscole.
        location ~* \.(?:ico|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
            try_files $uri =404;
            expires 24h;
            add_header Cache-Control "public, max-age=86400" always;
        }

        # Il fallback a index.html permette di aprire direttamente URL come /history gestiti poi da React Router.
        location / {
            try_files $uri $uri/ /index.html;
            # Chiede di non conservare la risposta della route generale, inclusa la pagina HTML iniziale.
            add_header Cache-Control "no-store" always;
        }
    }
}
