<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Documento HTML minimo usato da Vite per montare l'app React nel nodo root. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Adatta la larghezza del viewport al dispositivo, permettendo ai breakpoint MUI di seguire lo schermo. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
  </head>
  <body>
    <!-- Il nodo root ospita l’albero React; lo script modulo carica il bootstrap TSX tramite Vite. -->
    <div id="root"></div>
    <!-- Carica l'entrypoint come modulo JavaScript; Vite risolve e trasforma il sorgente TSX. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
