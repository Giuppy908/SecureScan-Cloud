# Configurazione del daemon clamd usato dal Worker.
# ClamAV gira come servizio interno dedicato: il browser non lo raggiunge, il
# Worker invece gli invia il file da scansionare sulla rete Docker interna.

# clamd ascolta sulla porta TCP usata dal Worker (`clamav:3310`).
TCPSocket 3310
TCPAddr 0.0.0.0
Foreground yes
FixStaleSocket true
SelfCheck 3600
# Timeout e limiti sono calibrati per supportare la pipeline reale fino a 250 MB
# di upload applicativo, lasciando margine al protocollo di streaming verso clamd.
ReadTimeout 180
CommandReadTimeout 180
StreamMaxLength 256M
MaxFileSize 250M
MaxScanSize 400M
MaxRecursion 12
MaxFiles 10000
AlertExceedsMax yes
