# Overlay production applicato sopra `compose.yaml`.
# Non ridefinisce l'intero stack: sovrascrive solo ciò che deve cambiare quando
# si passa da demo locale a un ambiente pubblico, in particolare secret
# obbligatori, modalità di avvio di Keycloak e variabili da non lasciare a
# placeholder demo.
services:
  postgres:
    # In produzione la password del database non può avere fallback deboli.
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for production}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:?KEYCLOAK_DB_NAME is required for production}
      KEYCLOAK_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:?KEYCLOAK_DB_USERNAME is required for production}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required for production}
    # Il bootstrap del DB Keycloak viene eseguito dal container PostgreSQL solo
    # alla prima inizializzazione del volume dati.
    volumes:
      - ../../infrastructure/postgres/init-keycloak-db.sh:/docker-entrypoint-initdb.d/20-init-keycloak-db.sh:ro

  keycloak:
    # Keycloak passa da `start-dev` locale a `start` con hostname pubblico
    # esplicito e configurazione DB dedicata.
    command:
      [
        "start",
        "--import-realm",
        "--hostname=${KEYCLOAK_PUBLIC_HOSTNAME:?KEYCLOAK_PUBLIC_HOSTNAME is required for production}"
      ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?KEYCLOAK_ADMIN_USERNAME is required for production}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required for production}
      KC_HTTP_ENABLED: ${KEYCLOAK_HTTP_ENABLED:-true}
      KC_PROXY_HEADERS: ${KEYCLOAK_PROXY_HEADERS:-xforwarded}
      KC_HOSTNAME_STRICT: ${KEYCLOAK_HOSTNAME_STRICT:-true}
      KC_HOSTNAME_STRICT_HTTPS: ${KEYCLOAK_HOSTNAME_STRICT_HTTPS:-true}
      KC_DB: ${KEYCLOAK_DB_VENDOR:-postgres}
      KC_DB_URL_HOST: ${KEYCLOAK_DB_HOST:-postgres}
      KC_DB_URL_PORT: ${KEYCLOAK_DB_PORT:-5432}
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME:?KEYCLOAK_DB_NAME is required for production}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:?KEYCLOAK_DB_USERNAME is required for production}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required for production}
    ports: !reset []

  keycloak-runtime-config:
    # In production gli utenti demo devono risultare disabilitati.
    environment:
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?KEYCLOAK_ADMIN_USERNAME is required for production}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required for production}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET is required for production}
      KEYCLOAK_PASSWORD_VERIFICATION_CLIENT_ID: ${KEYCLOAK_PASSWORD_VERIFICATION_CLIENT_ID:?KEYCLOAK_PASSWORD_VERIFICATION_CLIENT_ID is required for production}
      KEYCLOAK_PASSWORD_VERIFICATION_CLIENT_SECRET: ${KEYCLOAK_PASSWORD_VERIFICATION_CLIENT_SECRET:?KEYCLOAK_PASSWORD_VERIFICATION_CLIENT_SECRET is required for production}
      KEYCLOAK_DISABLE_DEMO_USERS: "true"

  analysis-api-1:
    # Anche l'API deve fallire subito se i secret production richiesti mancano.
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required for production}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET is required for production}
      KEYCLOAK_PASSWORD_VERIFICATION_CLIENT_ID: ${KEYCLOAK_PASSWORD_VERIFICATION_CLIENT_ID:?KEYCLOAK_PASSWORD_VERIFICATION_CLIENT_ID is required for production}
      KEYCLOAK_PASSWORD_VERIFICATION_CLIENT_SECRET: ${KEYCLOAK_PASSWORD_VERIFICATION_CLIENT_SECRET:?KEYCLOAK_PASSWORD_VERIFICATION_CLIENT_SECRET is required for production}

  analysis-api-2:
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required for production}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET is required for production}
      KEYCLOAK_PASSWORD_VERIFICATION_CLIENT_ID: ${KEYCLOAK_PASSWORD_VERIFICATION_CLIENT_ID:?KEYCLOAK_PASSWORD_VERIFICATION_CLIENT_ID is required for production}
      KEYCLOAK_PASSWORD_VERIFICATION_CLIENT_SECRET: ${KEYCLOAK_PASSWORD_VERIFICATION_CLIENT_SECRET:?KEYCLOAK_PASSWORD_VERIFICATION_CLIENT_SECRET is required for production}

  analysis-worker:
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required for production}

  postgres-exporter:
    # L'exporter usa la stessa password DB reale, senza fallback demo.
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-securescan}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for production}@postgres:5432/${POSTGRES_DB:-securescan}?sslmode=disable

  grafana:
    # La password admin di Grafana diventa obbligatoria in production.
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required for production}

  kong:
    # In production Kong resta dietro Caddy: la proxy port 8000 non deve essere
    # esposta pubblicamente, mentre Admin API e status restano solo su loopback.
    ports: !override
      - "127.0.0.1:8001:8001"
      - "127.0.0.1:8100:8100"

  frontend:
    # Il frontend viene servito pubblicamente da Caddy su 80/443.
    ports: !reset []

  caddy:
    image: caddy:2.10.2-alpine
    depends_on:
      frontend:
        condition: service_healthy
      kong:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      SECURESCAN_PUBLIC_FRONTEND_URL: ${SECURESCAN_PUBLIC_FRONTEND_URL:?SECURESCAN_PUBLIC_FRONTEND_URL is required}
      SECURESCAN_PUBLIC_KEYCLOAK_URL: ${SECURESCAN_PUBLIC_KEYCLOAK_URL:?SECURESCAN_PUBLIC_KEYCLOAK_URL is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - securescan-caddy-data:/data
      - securescan-caddy-config:/config
    restart: on-failure:3
    security_opt:
      - no-new-privileges:true
    networks:
      - securescan-local

volumes:
  # I certificati e lo stato ACME devono restare persistenti sulla VM.
  securescan-caddy-data:
    name: securescan-caddy-data
  securescan-caddy-config:
    name: securescan-caddy-config
