# Configurazione dichiarativa DB-less di Kong.
# Kong legge questo template, lo rende con variabili di ambiente e lo usa come
# configurazione finale del gateway. In pratica qui si descrive come il traffico
# proveniente dal browser raggiunge le due repliche della Analysis API.
_format_version: "3.0"
_transform: true

plugins:
  # Plugin globale che esporta metriche del gateway e dello stato upstream verso Prometheus.
  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true

upstreams:
  # Un upstream è il "pool" di backend equivalenti dietro cui Kong distribuisce
  # le richieste. Qui il pool è composto dalle due repliche della Analysis API.
  - name: analysis-api-upstream
    algorithm: round-robin
    slots: 10000
    # Gli health check attivi interrogano periodicamente /health per capire se
    # una replica è davvero pronta a ricevere traffico.
    healthchecks:
      active:
        type: http
        http_path: /health
        healthy:
          interval: 1
          successes: 1
          http_statuses:
            - 200
        unhealthy:
          interval: 1
          http_failures: 1
          tcp_failures: 1
          timeouts: 1
          http_statuses:
            - 429
            - 500
            - 502
            - 503
            - 504
      passive:
        healthy:
          successes: 0
        unhealthy:
          http_failures: 1
          tcp_failures: 1
          timeouts: 1
          http_statuses:
            - 429
            - 500
            - 502
            - 503
            - 504
    # I target sono i backend concreti del pool. Hanno stesso peso, quindi il
    # round-robin distribuisce il carico in modo simmetrico quando entrambi sono healthy.
    targets:
      - target: analysis-api-1:8000
        weight: 100
      - target: analysis-api-2:8000
        weight: 100

services:
  # Il service Kong rappresenta il backend logico verso cui puntano le route.
  # Browser e frontend non conoscono i target interni: vedono solo le route
  # esposte dal gateway.
  - name: analysis-api-service
    host: analysis-api-upstream
    port: 8000
    protocol: http
    path: /
    connect_timeout: 500
    read_timeout: 60000
    write_timeout: 60000
    retries: 5
    plugins:
      # CORS regola quali origini browser possono chiamare il gateway.
      # Non autentica l'utente: dice soltanto quali pagine web possono eseguire
      # richieste cross-origin senza essere bloccate dal browser.
      - name: cors
        config:
          origins:
__KONG_CORS_ORIGINS__
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - X-Request-ID
          exposed_headers:
            - Retry-After
            - X-Request-ID
            - X-RateLimit-Limit-Minute
            - X-RateLimit-Remaining-Minute
            - X-RateLimit-Reset
          credentials: false
          max_age: 3600
          preflight_continue: false
      # Il correlation ID aiuta tracing e troubleshooting tra browser, Kong,
      # backend e osservabilità.
      - name: correlation-id
        config:
          header_name: X-Request-ID
          generator: uuid
          echo_downstream: true
    routes:
      # Le route OPTIONS servono al preflight CORS richiesto dal browser.
      - name: analysis-api-options-route
        protocols:
          - http
          - https
        methods:
          - OPTIONS
        paths:
          - /api/v1
        strip_path: false
        preserve_host: false
      # Le route GET coprono letture come Dashboard, Cronologia, Dettaglio
      # analisi, Profilo e Stato del sistema. Il rate limiting protegge il
      # backend da raffiche eccessive di richieste.
      - name: analysis-api-read-route
        protocols:
          - http
          - https
        methods:
          - GET
        paths:
          - /api/v1
        strip_path: false
        preserve_host: false
        plugins:
          - name: rate-limiting
            config:
              minute: __KONG_RATE_LIMIT_GET_PER_MINUTE__
              policy: local
              limit_by: ip
              hide_client_headers: false
      # Route dedicata alle chiamate `/api/v1/me`, usate soprattutto da Profilo e Modifica profilo.
      - name: analysis-api-me-options-route
        protocols:
          - http
          - https
        methods:
          - OPTIONS
        paths:
          - /api/v1/me
        strip_path: false
        preserve_host: false
      - name: analysis-api-me-read-route
        protocols:
          - http
          - https
        methods:
          - GET
        paths:
          - /api/v1/me
        strip_path: false
        preserve_host: false
        plugins:
          - name: rate-limiting
            config:
              minute: __KONG_RATE_LIMIT_ME_GET_PER_MINUTE__
              policy: local
              limit_by: ip
              hide_client_headers: false
      # Route specifica per l'upload di nuove analisi. Qui, oltre al rate limit,
      # viene applicato il limite sulla dimensione del body.
      - name: analysis-api-upload-route
        protocols:
          - http
          - https
        methods:
          - POST
        paths:
          - /api/v1/analyses
        strip_path: false
        preserve_host: false
        plugins:
          - name: rate-limiting
            config:
              minute: __KONG_RATE_LIMIT_POST_PER_MINUTE__
              policy: local
              limit_by: ip
              hide_client_headers: false
          - name: request-size-limiting
            config:
              allowed_payload_size: __KONG_MAX_REQUEST_SIZE_MB__
              size_unit: megabytes
              require_content_length: false
      # Le route di scrittura generiche coprono POST/PUT/PATCH di altre aree applicative.
      - name: analysis-api-post-route
        protocols:
          - http
          - https
        methods:
          - POST
        paths:
          - /api/v1
        strip_path: false
        preserve_host: false
        plugins:
          - name: rate-limiting
            config:
              minute: __KONG_RATE_LIMIT_POST_PER_MINUTE__
              policy: local
              limit_by: ip
              hide_client_headers: false
      - name: analysis-api-me-post-route
        protocols:
          - http
          - https
        methods:
          - POST
        paths:
          - /api/v1/me
        strip_path: false
        preserve_host: false
        plugins:
          - name: rate-limiting
            config:
              minute: __KONG_RATE_LIMIT_ME_WRITE_PER_MINUTE__
              policy: local
              limit_by: ip
              hide_client_headers: false
      - name: analysis-api-put-route
        protocols:
          - http
          - https
        methods:
          - PUT
        paths:
          - /api/v1
        strip_path: false
        preserve_host: false
        plugins:
          - name: rate-limiting
            config:
              minute: __KONG_RATE_LIMIT_POST_PER_MINUTE__
              policy: local
              limit_by: ip
              hide_client_headers: false
      - name: analysis-api-me-put-route
        protocols:
          - http
          - https
        methods:
          - PUT
        paths:
          - /api/v1/me
        strip_path: false
        preserve_host: false
        plugins:
          - name: rate-limiting
            config:
              minute: __KONG_RATE_LIMIT_ME_WRITE_PER_MINUTE__
              policy: local
              limit_by: ip
              hide_client_headers: false
      - name: analysis-api-patch-route
        protocols:
          - http
          - https
        methods:
          - PATCH
        paths:
          - /api/v1
        strip_path: false
        preserve_host: false
        plugins:
          - name: rate-limiting
            config:
              minute: __KONG_RATE_LIMIT_POST_PER_MINUTE__
              policy: local
              limit_by: ip
              hide_client_headers: false
      # Le route DELETE sono più restrittive perché rimuovono dati o account.
      - name: analysis-api-delete-generic-route
        protocols:
          - http
          - https
        methods:
          - DELETE
        paths:
          - /api/v1
        strip_path: false
        preserve_host: false
        plugins:
          - name: rate-limiting
            config:
              minute: __KONG_RATE_LIMIT_DELETE_PER_MINUTE__
              policy: local
              limit_by: ip
              hide_client_headers: false
      - name: analysis-api-me-delete-route
        protocols:
          - http
          - https
        methods:
          - DELETE
        paths:
          - /api/v1/me
        strip_path: false
        preserve_host: false
        plugins:
          - name: rate-limiting
            config:
              minute: __KONG_RATE_LIMIT_ME_WRITE_PER_MINUTE__
              policy: local
              limit_by: ip
              hide_client_headers: false
      - name: analysis-api-delete-route
        protocols:
          - http
          - https
        methods:
          - DELETE
        paths:
          - /api/v1/analyses
        strip_path: false
        preserve_host: false
        plugins:
          - name: rate-limiting
            config:
              minute: __KONG_RATE_LIMIT_DELETE_PER_MINUTE__
              policy: local
              limit_by: ip
              hide_client_headers: false
      # /health è utile a Docker, Kong stesso e ai test di disponibilità.
      - name: analysis-api-health-route
        protocols:
          - http
          - https
        methods:
          - GET
        paths:
          - /health
        strip_path: false
        preserve_host: false
      # /docs e /openapi.json restano raggiungibili tramite gateway per l'uso locale della documentazione API.
      - name: analysis-api-docs-route
        protocols:
          - http
          - https
        methods:
          - GET
        paths:
          - /docs
          - /openapi.json
        strip_path: false
        preserve_host: false
